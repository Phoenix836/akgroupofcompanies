    <style>
    /* Ensure category machine images don't get cropped */
    .spec-image-container {
         width: 100%;
         height: 180px; 
         background: #000; 
         display: flex; 
         justify-content: center; 
         align-items: center; 
         margin-bottom: 15px; 
         border-bottom: 1px solid #333; }

    .spec-image-container img {

    }
    .card-text { 
        color: #FFCC00; 
        font-weight: bold;
