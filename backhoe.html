<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backhoe Loader Fleet | AK Group</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="catalogue-page">

<header class="header-logo">
    <img src="ak-logo.png" alt="AK Group Logo" class="logo-img">
</header>

<main class="section">

    <h2 class="services-title">Backhoe Loader Fleet</h2>

    <div class="fleet-grid services-grid" style="justify-content: center; max-width: 1000px; margin: 0 auto;">

        <!-- CARD 1 -->
        <div class="service-card">
            <div class="spec-image-container">
                <img src="jcb-3cx-backhoe-loader1.jpg" alt="JCB 3CX">
            </div>

            <div class="card-content">
                <h3>JCB 3CX</h3>
                <table class="mini-spec-table">
                    <tr><td>Engine Power</td><td>68.6 kW</td></tr>
                    <tr><td>Max Dig Depth</td><td>4.24 m</td></tr>
                    <tr><td>Loader Bucket</td><td>1.0 m³</td></tr>
                    <tr><td>Operating Weight</td><td>8,135 kg</td></tr>
                </table>
            </div>

            <div class="contact-buttons">
                <button class="contact-btn whatsapp"
                    onclick="window.open('https://wa.me/27659205429','_blank')">
                    WhatsApp
                </button>

                <button class="contact-btn email"
                    onclick="window.location.href='mailto:office@akgroupofcompanies.co.za'">
                    Email
                </button>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="service-card">
            <div class="spec-image-container">
                <img src="case-695st-skid-steer-loader.jpg" alt="Case 695ST">
            </div>

            <div class="card-content">
                <h3>Case 695ST</h3>
                <table class="mini-spec-table">
                    <tr><td>Engine Power</td><td>82 kW</td></tr>
                    <tr><td>Max Dig Depth</td><td>5.81 m</td></tr>
                    <tr><td>Loader Bucket</td><td>1.2 m³</td></tr>
                    <tr><td>Operating Weight</td><td>8,840 kg</td></tr>
                </table>
            </div>

            <div class="contact-buttons">
                <button class="contact-btn whatsapp"
                    onclick="window.open('https://wa.me/27659205429','_blank')">
                    WhatsApp
                </button>

                <button class="contact-btn email"
                    onclick="window.location.href='mailto:office@akgroupofcompanies.co.za'">
                    Email
                </button>
            </div>
        </div>

    </div>

</main>

<footer>
    <p>2026 AK Group of Companies</p>
</footer>

</body>
</html>
